<!DOCTYPE html>
<html>
<head>
  <base href="https://github.com">
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
  <style>
    #game-frame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
      margin: 0;
      padding: 0;
      overflow: hidden;
      z-index: 9999;
      display: none;
    }
    .dl-btn {
      display: block;
      margin: 15px auto;
      padding: 10px 20px;
      background: #23272a;
      color: #fff;
      border: 2px solid #5865f2;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }
    .dl-btn:hover { background: #5865f2; }
    .dl-btn:disabled { border-color: #4f545c; color: #72767d; cursor: not-allowed; }
  </style>
</head>
<body>
  <div id="ui-container">
    <div class="logo-container">
      <img src="logo.png" alt="Logo" class="logo">
    </div>
    
    <div class="menu">
      <button id="download-btn" class="dl-btn">Download Game Files (Offline Mode)</button>
      
      <a href="javascript:loadChapter(1)" class="row" data-ch="1">
        <span class="chapter">Chapter 1</span>
        <span class="title">The Beginning</span>
        <img src="icons/1.png">
      </a>
      <a href="javascript:loadChapter(2)" class="row" data-ch="2">
        <span class="chapter">Chapter 2</span>
        <span class="title">A Cyber's World</span>
        <img src="icons/2.png">
      </a>
      <a href="javascript:loadChapter(3)" class="row" data-ch="3">
        <span class="chapter">Chapter 3</span>
        <span class="title">Late Night</span>
        <img src="icons/3.png">
      </a>
      <a href="javascript:loadChapter(4)" class="row" data-ch="4">
        <span class="chapter">Chapter 4</span>
        <span class="title">Prophecy</span>
        <img src="icons/4.png">
      </a>
      <a href="javascript:loadChapter(5)" class="row" data-ch="5">
        <span class="chapter">Chapter 5</span>
        <span class="title">Festival Day</span>
        <img src="icons/5.png">
      </a>
      <a href="javascript:alert('Chapter 6 coming soon!')" class="disabled-row">
        <span class="chapter">Chapter 6</span>
        <span class="disabled-title">--</span>
        <img src="icons/0.png">
      </a>
      <a href="javascript:alert('Chapter 7 coming soon!')" class="disabled-row">
        <span class="chapter">Chapter 7</span>
        <span class="disabled-title">--</span>
        <img src="icons/0.png">
      </a>
      <a href="javascript:window.open('https://github.com', '_blank')" class="row">
        <span class="chapter"></span>
        <span class="title">contrib by hummingbird-9</span>
        <span class="badge"></span>
      </a>
      <a href="javascript:window.open('https://truffled.lol', '_blank')" class="row">
        <span class="chapter"></span>
        <span class="title">port by bog</span>
        <span class="badge"></span>
      </a>
       <a href="javascript:window.open('https://web.app', '_blank')" class="row">
        <span class="chapter"></span>
        <span class="title">and geeked</span>
        <span class="badge"></span>
      </a>
    </div>

    <audio id="drone" controls loop autoplay hidden>
      <source src="audios/AUDIO_DRONE.ogg" type="audio/ogg">
    </audio>
    <button id="mute">Mute Audio</button>
  </div>

  <iframe id="game-frame"></iframe>

  <script>
    const audio = document.getElementById('drone');
    const mute = document.getElementById('mute');
    const uiContainer = document.getElementById('ui-container');
    const gameFrame = document.getElementById('game-frame');
    const dlBtn = document.getElementById('download-btn');
    let gamestarted = false;
    let prefetched = new Set();
  
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then(reg => {
        navigator.serviceWorker.addEventListener('message', e => {
          if (e.data.type === 'STATUS') dlBtn.textContent = e.data.msg;
          if (e.data.type === 'DONE') dlBtn.disabled = true;
        });
      });
    }

    dlBtn.addEventListener('click', () => {
      if (navigator.serviceWorker.controller) {
        dlBtn.disabled = true;
        navigator.serviceWorker.controller.postMessage({ action: 'DOWNLOAD_ALL' });
      } else {
        alert('Cache worker initializing. Try again in 2 seconds.');
      }
    });

    mute.addEventListener('click', () => {
      if (!gamestarted) {
        audio.muted = !audio.muted;
        updateButton(); 
      }
    });
  
    function updateButton() {
      if (!gamestarted) {
        mute.textContent = audio.muted ? 'Unmute Audio' : 'Mute Audio';
      }
    }
  
    updateButton();

    function loadChapter(chapter) {
      gamestarted = true;
      audio.pause();
      audio.src = '';
      audio.load();
      document.removeEventListener('keydown', handleKeyDown);
      
      uiContainer.style.display = 'none';
      gameFrame.style.display = 'block';
      gameFrame.src = `chapter${chapter}/index.html`;
      gameFrame.focus();
    }

    const menumoveaudio = new Audio('audios/snd_menumove.mp3');
    const menuselectaudio = new Audio('audios/snd_select.mp3');
    
    document.querySelectorAll('.menu .row').forEach((row, index) => {
      row.addEventListener('mouseenter', () => {
        if (!gamestarted) {
          menumoveaudio.play();
          
          const chNum = row.getAttribute('data-ch');
          if (chNum && !prefetched.has(chNum)) {
            prefetched.add(chNum);
            const link = document.createElement('link');
            link.rel = 'prefetch';
            link.href = `chapter${chNum}/index.html`;
            document.head.appendChild(link);
          }

          if (selectedChapter !== null) {
            const rows = document.querySelectorAll('.menu .row');
            if (rows[selectedChapter]) rows[selectedChapter].classList.remove("selected");
          }
          selectedChapter = index;
          row.classList.add("selected");
        }
      });
      row.addEventListener('click', () => {
        if (!gamestarted) {
          menuselectaudio.play();
        }
      });
    });

    let selectedChapter = null;
    function handleKeyDown(event) {
      if (gamestarted) return;
      const rows = document.querySelectorAll('.menu .row');
      
      if (event.key === 'ArrowUp') {
        if (selectedChapter === null) {
          selectedChapter = 0;
          rows.classList.add("selected");
          menumoveaudio.play();
        } else {
          rows[selectedChapter].classList.remove("selected");
          selectedChapter--;
          if (selectedChapter < 0) selectedChapter = rows.length - 1;
          rows[selectedChapter].classList.add("selected");
          menumoveaudio.play();
        }
      } else if (event.key === 'ArrowDown') {
        if (selectedChapter === null) {
          selectedChapter = 0;
          rows.classList.add("selected");
          menumoveaudio.play();
        } else {
          if (selectedChapter + 1 >= rows.length) {
            rows[selectedChapter].classList.remove("selected");
            selectedChapter = 0;
            rows.classList.add("selected");
            menumoveaudio.play();
          } else {
            rows[selectedChapter].classList.remove("selected");
            selectedChapter++;
            rows[selectedChapter].classList.add("selected");
            menumoveaudio.play();
          }
        }
      } else if (event.key === 'Enter') {
        if (selectedChapter !== null) {
          menuselectaudio.play();
          rows[selectedChapter].click();
        } 
      }
    }
    
    document.addEventListener('keydown', handleKeyDown);
  </script>
</body>
</html>
