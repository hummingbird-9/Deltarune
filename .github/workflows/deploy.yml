name: Deploy Pages with Compression

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compress Audio Files to Save Space
        run: |
          echo "Optimizing audio file parameters..."
          find . -type f \( -name "*.mp3" -o -name "*.ogg" \) | while read -r file; do
            ffmpeg -y -i "$file" -b:a 64k "temp_file.${file##*.}"
            mv "temp_file.${file##*.}" "$file"
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
